services:
  temporal:
    image: temporalio/auto-setup:1.26.3.0
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-db
    ports:
      - 7233:7233
    depends_on:
      - temporal-db

  temporal-db:
    image: postgres:12
    environment:
      - POSTGRES_PASSWORD=temporal
      - POSTGRES_USER=temporal
      - POSTGRES_DB=temporal
    ports:
      - 5432:5432
    volumes:
      - temporal-db-data:/var/lib/postgresql/data

  temporal-ui:
    image: temporalio/ui:2.26.2
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - 8080:8080
    depends_on:
      - temporal

  app-db:
    image: postgres:16
    environment:
      - POSTGRES_USER=subtasks
      - POSTGRES_PASSWORD=subtasks
      - POSTGRES_DB=subtasks
    ports:
      - 5433:5432
    volumes:
      - app-db-data:/var/lib/postgresql/data

volumes:
  app-db-data:
  temporal-db-data:
