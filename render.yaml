# Render Blueprint: New → Blueprint → pick this repo.
#
# One free web service runs both the UI/API and the Temporal worker (all.ts).
# The database is Neon and Temporal is Temporal Cloud — both outside Render, so their
# connection details are entered by hand when the Blueprint is applied (sync: false).
# Jira credentials are per user (entered at sign-in), so there are no Jira secrets here.

services:
  - type: web
    name: cheat
    runtime: node
    plan: free           # sleeps after ~15 min idle; the first request wakes it (~1 min)
    buildCommand: npm ci
    startCommand: npm run start:all
    healthCheckPath: /
    envVars:
      # Neon → Connection string (keep ?sslmode=require on the end)
      - key: DATABASE_URL
        sync: false
      # Temporal Cloud → namespace → endpoint, e.g. my-ns.a1b2c.tmprl.cloud:7233
      - key: TEMPORAL_ADDRESS
        sync: false
      # Temporal Cloud namespace id, e.g. my-ns.a1b2c
      - key: TEMPORAL_NAMESPACE
        sync: false
      # Temporal Cloud → API keys
      - key: TEMPORAL_API_KEY
        sync: false
      # Encrypts users' stored Jira tokens. Generated once; never change it.
      - key: APP_SECRET
        generateValue: true
      - key: JIRA_BASE_URL
        value: https://autochek.atlassian.net
      # Render terminates HTTPS in front of the app — lets the session cookie be marked secure
      - key: TRUST_PROXY
        value: "true"
